name: Build Windows Executable

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-windows:
    name: Build EXE on Windows
    runs-on: windows-latest
    
    # This environment variable forces the actions to use the newer Node.js 24 runtime, 
    # fixing the deprecation warnings for checkout, setup-python, and upload-artifact.
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11' 
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-build.txt

      - name: Build with PyInstaller
        run: |
          python -m PyInstaller remover.spec --noconfirm

      - name: Upload Executable as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NotebookLM-Watermark-Remover-EXE
          path: dist/NotebookLM-Watermark-Remover.exe
          retention-days: 90
